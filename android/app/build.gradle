plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

// Read current values
def currentVersionCode = (localProperties.getProperty("VERSION_CODE") ?: "1").toInteger()
def currentVersionName = localProperties.getProperty("VERSION_NAME") ?: "1.0.0"

// ---- AUTO INCREMENT LOGIC ----

// versionCode → +1
def newVersionCode = currentVersionCode + 1

// versionName → increment PATCH (1.0.X)
def parts = currentVersionName.split("\\.")
def major = parts[0].toInteger()
def minor = parts[1].toInteger()
def patch = parts[2].toInteger() + 1

def newVersionName = "${major}.${minor}.${patch}"

// Save back automatically
localProperties.setProperty("VERSION_CODE", newVersionCode.toString())
localProperties.setProperty("VERSION_NAME", newVersionName)
localPropertiesFile.withWriter { writer ->
    localProperties.store(writer, null)
}
android {
    namespace "com.luffy1705.fluxkart"
//    compileSdk flutter.compileSdkVersion
    compileSdk 36
//    ndkVersion flutter.ndkVersion
//    ndkVersion flutter.ndkVersion
    ndkVersion "27.0.12077973"
//    packagingOptions {
//        doNotStrip "**/*.so"
//    }
//    jniLibs {
//        useLegacyPackaging true
//    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }
    tasks.whenTaskAdded { task ->
        if (task.name.toLowerCase().contains("stripdebugsymbols")) {
            task.enabled = false
        }
    }

    defaultConfig {
        applicationId "com.luffy1705.fluxkart"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
//        minSdkVersion flutter.minSdkVersion
//        targetSdkVersion flutter.targetSdkVersion
        minSdkVersion 24
        targetSdkVersion 36
        versionCode newVersionCode
        versionName newVersionName
    }

    signingConfigs {
        release {
            release {
                def keystorePropertiesFile = rootProject.file("key.properties")
                def keystoreProperties = new Properties()

                if (!keystorePropertiesFile.exists()) {
                    throw new GradleException("key.properties file not found for release signing")
                }

                keystoreProperties.load(new FileInputStream(keystorePropertiesFile))

                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release

//            ndk {
//                debugSymbolLevel 'NONE'
//            }
        }
    }
    android.applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def appName = "FluxKart"
            def buildType = variant.buildType.name   // debug / release
            def versionName = variant.versionName

            // Optional flavor name
            def flavorName = variant.flavorName
            if (flavorName == null || flavorName.isEmpty()) {
                flavorName = "default"
            }

            outputFileName = "${appName}-${flavorName}-${buildType}-${versionName}.apk"
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
}
