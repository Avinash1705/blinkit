name: Flutter CI - FluxKart

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup Java (required for Android)
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3️⃣ Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      # 4️⃣ Flutter version check
      - name: Flutter doctor
        run: flutter doctor -v

      # 5️⃣ Get dependencies
      - name: Install dependencies
        run: flutter pub get

      # 6️⃣ Analyze code
      - name: Analyze project
        run: flutter analyze

      # 7️⃣ Run tests
      - name: Run tests
        run: flutter test

      # 8️⃣ Build APK
      - name: Build APK
        run: flutter build apk --debug
